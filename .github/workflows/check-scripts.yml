name: Check scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and header check
        run: node .github/scripts/check-scripts.mjs
      - name: Open-in-TerraWorld links in samples/README.md are current
        run: node tools/make-link.mjs --check-readme
      - name: Type-check against types/terraworld.d.ts
        run: node .github/scripts/typecheck-scripts.mjs
        env:
          TSC: npx -y -p typescript@5 tsc
