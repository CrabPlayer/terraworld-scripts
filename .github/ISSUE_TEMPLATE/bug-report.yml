name: Bug report
description: Something in the tw script API or the Script panel does not work as documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [docs](https://github.com/CrabPlayer/terraworld-scripts/tree/main/docs) first:
        some features (pickRegion, tw.edit, plugins) are not available yet.
        English or Vietnamese is fine.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - tw API (wrong result, missing function, error)
        - Script panel / output display
        - Modal or prompt form
        - Map highlight or pointers
        - Local scripts (twscript folder)
        - Documentation is wrong
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: Smallest script that shows the problem
      render: js
    validations:
      required: false
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: Copy the error shown in the Script panel, if any.
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: world
    attributes:
      label: World size
      options:
        - Small
        - Medium
        - Large
        - Other / modded (tModLoader)
